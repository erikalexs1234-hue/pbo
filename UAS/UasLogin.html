
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UAS Login PBO - Modern Edition</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Custom Animations */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-10px); }
      80% { transform: translateX(10px); }
    }
    .animate-shake {
      animation: shake 0.5s ease-in-out;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .animate-spin-custom {
      animation: spin 1s linear infinite;
    }

    .hidden {
      display: none;
    }
    
    /* Smooth transitions for card content */
    .fade-up {
      animation: fadeUp 0.6s ease-out forwards;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-amber-400 via-amber-200 to-amber-100 min-h-screen flex items-center justify-center p-6">

  <!-- MAIN CARD CONTAINER -->
  <div class="w-full max-w-md bg-white rounded-[2.5rem] shadow-2xl shadow-amber-900/10 overflow-hidden border border-white/50 backdrop-blur-sm" id="mainCard">
    
    <!-- LOGIN PAGE VIEW -->
    <div id="loginPage" class="p-8 md:p-12 fade-up">
      <div class="flex flex-col items-center mb-10">
        <div class="w-20 h-20 bg-gradient-to-br from-red-500 to-rose-600 rounded-3xl flex items-center justify-center shadow-xl shadow-rose-200 mb-6 rotate-3 hover:rotate-0 transition-transform duration-300">
          <span class="text-white font-bold text-2xl tracking-widest">PBO</span>
        </div>
        <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Login Akun</h1>
        <p class="text-slate-500 mt-2">Silakan masuk untuk melanjutkan</p>
      </div>

      <div class="space-y-4">
        <!-- Input Username -->
        <div class="relative group">
          <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-amber-500 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <input id="inputUsername" type="text" placeholder="Username" 
            class="w-full pl-11 pr-4 py-3.5 bg-white border border-slate-200 rounded-2xl outline-none focus:border-amber-400 focus:ring-4 focus:ring-amber-400/10 transition-all placeholder:text-slate-400 text-slate-700 shadow-sm">
        </div>

        <!-- Input Password -->
        <div class="relative group">
          <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-amber-500 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </div>
          <input id="inputPassword" type="password" placeholder="Password" 
            class="w-full pl-11 pr-12 py-3.5 bg-white border border-slate-200 rounded-2xl outline-none focus:border-amber-400 focus:ring-4 focus:ring-amber-400/10 transition-all placeholder:text-slate-400 text-slate-700 shadow-sm">
          <button id="toggleEye" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors cursor-pointer">
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>

        <div class="pt-4 space-y-3">
          <button class="btn-login w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-2xl shadow-lg shadow-slate-200 transition-all flex items-center justify-center gap-2 group">
            <span>LOGIN</span>
            <div class="w-1.5 h-1.5 bg-amber-400 rounded-full group-hover:scale-150 transition-transform"></div>
          </button>
          
          <button class="btn-cancel w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold py-4 rounded-2xl transition-all">
            CANCEL
          </button>
        </div>

        <!-- LOADING SPINNER -->
        <div id="loading" class="hidden flex justify-center py-2">
          <div class="w-6 h-6 border-4 border-slate-200 border-t-amber-500 rounded-full animate-spin-custom"></div>
        </div>
      </div>
    </div>

    <!-- PROFILE PAGE VIEW -->
    <div id="profilePage" class="p-10 text-center flex flex-col items-center hidden fade-up">
      <div class="mb-8 p-4 bg-emerald-50 rounded-full text-emerald-500 animate-bounce">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </div>
      
      <h2 class="text-3xl font-bold text-slate-800 mb-2">Login Berhasil!</h2>
      <p id="welcomeText" class="text-slate-500 mb-8 max-w-[280px] mx-auto"></p>

      <div class="w-full h-[1px] bg-slate-100 mb-8"></div>

      <button class="btn-logout w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-rose-100 transition-all flex items-center justify-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
        <span>LOGOUT SEKARANG</span>
      </button>
    </div>

  </div>

  <script>
    // ===== MODEL (PBO ORIGINAL) =====
    class User {
      constructor(username, password) {
        this.username = username;
        this.password = password;
      }
    }

    // ===== DATABASE (PBO ORIGINAL) =====
    class UserDatabase {
      static init() {
        if (!localStorage.getItem("users")) {
          localStorage.setItem("users", JSON.stringify([
            new User("Erik1234", "Erik3456")
          ]));
        }
      }
      static getUsers() {
        return JSON.parse(localStorage.getItem("users")) || [];
      }
    }

    // ===== AUTH (PBO ORIGINAL) =====
    class AuthService {
      static login(username, password) {
        return UserDatabase.getUsers().find(
          u => u.username === username && u.password === password
        );
      }
      static save(user) {
        localStorage.setItem("currentUser", JSON.stringify(user));
      }
      static get() {
        return JSON.parse(localStorage.getItem("currentUser"));
      }
      static logout() {
        localStorage.removeItem("currentUser");
      }
    }

    // ===== CONTROLLER (PBO ORIGINAL - Updated DOM Interaction) =====
    class LoginController {
      constructor() {
        this.bindEvents();
        this.autoLogin();
      }

      bindEvents() {
        document.querySelector(".btn-login")
          .addEventListener("click", () => this.login());

        document.querySelector(".btn-cancel")
          .addEventListener("click", () => this.cancel());

        document.querySelector(".btn-logout")
          .addEventListener("click", () => this.logout());

        document.getElementById("toggleEye")
          .addEventListener("click", () => this.togglePassword());
      }

      login() {
        const user = document.getElementById("inputUsername").value;
        const pass = document.getElementById("inputPassword").value;
        const loading = document.getElementById("loading");
        const mainCard = document.getElementById("mainCard");

        // UI Logic
        loading.classList.remove("hidden");

        setTimeout(() => {
          const result = AuthService.login(user, pass);
          loading.classList.add("hidden");

          if (result) {
            AuthService.save(result);
            this.showProfile();
          } else {
            // Shake effect for feedback
            mainCard.classList.add("animate-shake");
            setTimeout(() => mainCard.classList.remove("animate-shake"), 500);
            alert("Login gagal! Username atau password salah.");
          }
        }, 1000);
      }

      showProfile() {
        const user = AuthService.get();
        if (!user) return;

        const loginPage = document.getElementById("loginPage");
        const profilePage = document.getElementById("profilePage");
        const welcomeText = document.getElementById("welcomeText");

        loginPage.classList.add("hidden");
        profilePage.classList.remove("hidden");
        welcomeText.innerHTML = `Halo <b>${user.username}</b>, selamat datang di sistem PBO kami 👋`;
      }

      logout() {
        AuthService.logout();
        const loginPage = document.getElementById("loginPage");
        const profilePage = document.getElementById("profilePage");
        
        profilePage.classList.add("hidden");
        loginPage.classList.remove("hidden");
        
        // Reset inputs
        document.getElementById("inputUsername").value = "";
        document.getElementById("inputPassword").value = "";
      }

      cancel() {
        if (confirm("Yakin ingin keluar?")) history.back();
      }

      togglePassword() {
        const passInput = document.getElementById("inputPassword");
        const eyeIcon = document.getElementById("eyeIcon");
        
        if (passInput.type === "password") {
          passInput.type = "text";
          eyeIcon.innerHTML = `<path d="M9.88 9.88L12 12m.12 2.12L12 12m0 0l-2.12 2.12M12 12l2.12-2.12M2 2l20 20M8.47 8.47C6.44 9.15 4.13 10.74 2 12c3 7 10 7 10 7 1.41 0 2.76-.2 3.96-.58m2.51-2.51C20.32 14.73 21.6 13.26 22 12c-3-7-10-7-10-7-1.12 0-2.19.16-3.18.45"/><path d="M15 15a3 3 0 1 1-4.24-4.24"/>`;
        } else {
          passInput.type = "password";
          eyeIcon.innerHTML = `<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>`;
        }
      }

      autoLogin() {
        if (AuthService.get()) this.showProfile();
      }
    }

    // INIT
    UserDatabase.init();
    new LoginController();
  </script>

</body>
</html>
